<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src 'self' rmedia:; connect-src 'self' rmedia:; style-src 'self' 'unsafe-inline'">
  <title>Resonance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="now">
  <header class="bar" id="bar">
    <div class="bar-r">
      <button class="wbtn" id="wMin" title="Свернуть"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
      <button class="wbtn" id="wMax" title="Развернуть"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg></button>
      <button class="wbtn close" id="wClose" title="Закрыть"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </div>
  </header>

  <nav class="rail">
    <div class="rail-top">
      <button class="fab" id="add" title="Добавить папку"><i data-i="add"></i></button>
      <button class="rail-item active" data-view="tracks"><span class="pill"><i data-i="music"></i></span><span class="lbl">Треки</span></button>
      <button class="rail-item" data-view="albums"><span class="pill"><i data-i="album"></i></span><span class="lbl">Альбомы</span></button>
      <button class="rail-item" data-view="artists"><span class="pill"><i data-i="person"></i></span><span class="lbl">Артисты</span></button>
      <button class="rail-item" data-view="favs"><span class="pill"><i data-i="heart"></i></span><span class="lbl">Избранное</span></button>
      <button class="rail-item" data-view="eq"><span class="pill"><i data-i="eq"></i></span><span class="lbl">Звук</span></button>
    </div>
    <button class="rail-item" data-view="settings"><span class="pill"><i data-i="settings"></i></span><span class="lbl">Настройки</span></button>
  </nav>

  <main class="main">
    <header class="head">
      <div class="titles">
        <h1 id="title">Треки</h1>
        <p id="sub"></p>
      </div>
      <label class="search">
        <i data-i="search"></i>
        <input id="q" type="search" placeholder="Поиск по музыке" autocomplete="off" spellcheck="false">
      </label>
    </header>
    <div class="chips" id="chips"></div>
    <section class="content" id="content"></section>
  </main>

  <aside class="now">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="now">Сейчас</button>
      <button class="tab" data-tab="lyrics">Текст</button>
      <button class="tab" data-tab="queue">Очередь</button>
    </div>

    <div class="stage">
      <div class="pane p-now">
        <div class="cover-wrap" id="coverWrap">
          <canvas id="ring"></canvas>
          <div class="cover" id="cover"><img id="coverImg" alt=""><i data-i="music" class="ph"></i></div>
        </div>
      </div>
      <div class="pane p-lyrics">
        <div class="lyrics" id="lyrics"></div>
        <button class="mini lyswap" id="lySwap" title="Подобрать другой текст" hidden>Другой текст</button>
        <div class="lypick" id="lyPick">
          <div class="lyhead"><b>Подобрать текст</b><button class="mini" id="lyClose">Закрыть</button></div>
          <div class="lysearch"><input id="lyQ" type="text" placeholder="Название песни" autocomplete="off" spellcheck="false"><button class="mini" id="lyGo">Искать</button></div>
          <label class="lyscale"><input type="checkbox" class="switch" id="lyScale" checked><span>Подогнать тайминги под длину моего трека<small>Для sped up и замедленных версий. У ремикса с другой структурой лучше выключить.</small></span></label>
          <div class="lylist" id="lyList"></div>
        </div>
      </div>
      <div class="pane p-queue"><div class="queue" id="queue"></div></div>
    </div>

    <div class="dock">
      <div class="meta">
        <div class="mt">
          <h2 id="nTitle">Ничего не играет</h2>
          <p id="nArtist">Выбери трек в библиотеке</p>
        </div>
        <button class="ctl toggle" id="fav" title="В избранное"><i data-i="heart"></i></button>
      </div>
      <div class="seek">
        <canvas id="wave"></canvas>
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="dock-low">
        <canvas id="viz"></canvas>
        <div class="controls">
          <button class="ctl toggle" id="shuffle" title="Перемешать"><i data-i="shuffle"></i></button>
          <button class="ctl" id="prev" title="Назад"><i data-i="prev"></i></button>
          <button class="play" id="play" title="Играть"><i data-i="play" id="playIcon"></i></button>
          <button class="ctl" id="next" title="Вперёд"><i data-i="next"></i></button>
          <button class="ctl toggle" id="repeat" title="Повтор"><i data-i="repeat"></i></button>
        </div>
        <div class="vol">
          <button class="mini" id="speed" title="Скорость">1×</button>
          <button class="mini" id="sleep" title="Таймер сна"><i data-i="timer"></i><span id="sleepTxt">Сон</span></button>
          <button class="mini ico" id="vizBtn" title="Визуализатор"><i data-i="eq"></i></button>
          <i data-i="volume"></i><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </aside>

  <script src="util.js"></script>
  <script src="menu.js"></script>
  <script src="eq.js"></script>
  <script src="eqview.js"></script>
  <script src="lyrics.js"></script>
  <script src="viz.js"></script>
  <script src="app.js"></script>
  <script src="context.js"></script>
</body>
</html>
